# Tự động xuất bản game lên GitHub Pages mỗi khi đẩy code lên nhánh main (hoặc bấm chạy tay ở tab Actions).
# Cần: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ giữ một lần deploy mới nhất, huỷ lần cũ nếu đẩy liên tiếp
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Chỉ đưa phần game lên web; bỏ mã dựng, SQL, script, bản nhân vật gốc nặng 14 MB (game dùng hero.web.glb)
      - name: Chuẩn bị thư mục xuất bản
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude='/.git' --exclude='/.github' --exclude='/_site' --exclude='/dev' \
            --exclude='/launcher' --exclude='/scripts' --exclude='/supabase' --exclude='/.env*' --exclude='/.gitignore' \
            --exclude='/assets/hero.glb' --exclude='*.exe' --exclude='*.command' --exclude='README.md'
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/js/main.js && test -f _site/assets/hero.web.glb
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
