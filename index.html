<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Game 3D học từ vựng tiếng Anh cho học sinh K12: nghe phát âm, chọn nghĩa trong 5 giây để đánh bại bot.">
  <title>Word Arena · Đấu Trường Từ Vựng</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="floaters"></div>
  <div id="speedlines"></div>
  <div id="fxflash"></div>

  <!-- Menu chọn chủ đề / độ khó -->
  <section id="menu" class="screen">
    <div class="panel menu-panel">
      <div class="logo"><span class="logo-icon">⚔️</span><span>Word <b>Arena</b></span></div>
      <p class="tagline">Đấu trường từ vựng tiếng Anh</p>

      <h3>1 · Chọn chủ đề</h3>
      <div id="topics" class="choices topics"></div>

      <h3>2 · Chọn độ khó</h3>
      <div id="levels" class="choices levels"></div>

      <button id="startBtn" class="btn-primary">Vào đấu trường!</button>
      <p class="foot">Nghe phát âm, chọn nghĩa đúng trong <b>5 giây</b>. Đúng và nhanh thì đánh trúng Bot! Phím tắt <kbd>1</kbd>–<kbd>4</kbd>.</p>
    </div>
  </section>

  <!-- HUD trong trận -->
  <section id="hud" class="hidden">
    <div class="topbar">
      <div class="fighter left">
        <div class="name">Bạn</div>
        <div class="hp"><i id="hpHero"></i><span id="hpHeroText">100</span></div>
      </div>
      <div class="round">
        <small>Câu</small><b id="roundNo">1/10</b>
        <button id="quitBtn" class="quit">Thoát</button>
      </div>
      <div class="fighter right">
        <div class="name"><span id="botName">Bot</span></div>
        <div class="hp"><i id="hpBot"></i><span id="hpBotText">100</span></div>
        <div id="botState" class="botstate"></div>
      </div>
    </div>

    <div class="question">
      <div class="word-card" id="wordCard">
        <button id="speakBtn" class="speak" aria-label="Nghe lại">🔊</button>
        <div class="word" id="word">—</div>
      </div>
      <div class="timer">
        <div class="track"><i id="timerBar"></i></div>
        <b id="timerNum">5</b>
      </div>
    </div>

    <div id="answers" class="answers"></div>
  </section>

  <div id="banner"></div>

  <!-- Kết quả -->
  <section id="result" class="screen hidden">
    <div class="panel result-panel">
      <div id="resultTitle" class="result-title"></div>
      <div id="resultStars" class="stars"></div>
      <div id="resultStats" class="stats"></div>
      <div id="missedBox" class="missed hidden">
        <h4>Từ cần ôn lại</h4>
        <ul id="missedList"></ul>
      </div>
      <div class="result-actions">
        <button id="againBtn" class="btn-primary">Chơi lại</button>
        <button id="menuBtn" class="btn-ghost">Về menu</button>
      </div>
    </div>
  </section>

  <button id="muteBtn" class="icon-btn" aria-label="Bật/tắt âm thanh">🔊</button>
  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
